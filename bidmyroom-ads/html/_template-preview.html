<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BidMyRoom Ad — Preview Template</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap");

      :root {
        --brand: #0f81c0;
        --white: #ffffff;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: auto;
        font-family: "Poppins", sans-serif;
        background: #0a0a0a;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        margin: 0 auto;
        transform-origin: top center;
      }

      /* Video background */
      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        object-fit: fill;
      }

      /* ============ OVERLAYS ============ */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
        opacity: 0;
        transition: opacity 1s var(--ease-smooth);
      }
      .vignette.active { opacity: 1; }

      .bottom-gradient {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 60%;
        background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
        opacity: 0;
        transition: opacity 0.8s var(--ease-smooth);
      }
      .bottom-gradient.active { opacity: 1; }

      /* ============ SCENE SYSTEM ============ */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
      }

      /* ============ ADD YOUR SCENES HERE ============ */

      /* Scene 1: Example headline */
      #scene-1 { justify-content: flex-end; padding-bottom: 280px; }

      .headline {
        font-size: 72px;
        font-weight: 800;
        line-height: 1.15;
        color: var(--white);
        text-align: center;
        padding: 0 80px;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      }

      .headline .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(60px);
        filter: blur(10px);
      }

      #scene-1.active .headline .word {
        animation: word-in 0.6s var(--ease-out) forwards;
      }
      #scene-1.active .headline .word:nth-child(1) { animation-delay: 0.0s; }
      #scene-1.active .headline .word:nth-child(2) { animation-delay: 0.1s; }
      #scene-1.active .headline .word:nth-child(3) { animation-delay: 0.2s; }

      @keyframes word-in {
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      #scene-1.exit .headline .word {
        animation: word-out 0.3s var(--ease-smooth) forwards;
      }
      @keyframes word-out {
        to { opacity: 0; transform: translateY(-30px); filter: blur(8px); }
      }

      /* ============ CONTROLS ============ */
      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        background: rgba(0,0,0,0.9);
        padding: 16px 20px;
        border-radius: 12px;
        color: white;
        font-family: monospace;
        font-size: 13px;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .controls button {
        background: var(--brand);
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 8px;
        font-size: 13px;
      }
      .controls button:hover { background: #0a6da8; }
      .time-display { margin-top: 12px; font-size: 18px; }
      .export-info { margin-top: 6px; font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <div class="controls">
      <button onclick="restartVideo()">Restart</button>
      <button onclick="skipToText()">Skip to Text</button>
      <div class="time-display">Time: <span id="time">0.00</span>s</div>
      <div class="export-info">1080x1920 (9:16)</div>
    </div>

    <div class="stage">
      <!-- UPDATE: Video source path -->
      <video class="video-bg" id="video" muted playsinline>
        <source src="../un-edited-videos/YOUR-VIDEO.mp4" type="video/mp4" />
      </video>

      <div class="vignette" id="vignette"></div>
      <div class="bottom-gradient" id="gradient"></div>

      <!-- UPDATE: Add your scenes here -->
      <div class="scene" id="scene-1">
        <h1 class="headline">
          <span class="word">Your</span>&nbsp;
          <span class="word">Text</span>&nbsp;
          <span class="word">Here</span>
        </h1>
      </div>
    </div>

    <script>
      const video = document.getElementById("video");
      const vignette = document.getElementById("vignette");
      const gradient = document.getElementById("gradient");
      const scene1 = document.getElementById("scene-1");
      const timeDisplay = document.getElementById("time");

      // ============ UPDATE: Timing config ============
      const T = {
        effectsIn: 10.0,
        scene1In: 10.5,
        scene1Out: 13.0,
        // Add more scenes...
      };

      let triggered = {};

      function showScene(scene) {
        scene.style.opacity = "1";
        scene.classList.add("active");
      }

      function exitScene(scene) {
        scene.classList.add("exit");
        setTimeout(() => { scene.style.opacity = "0"; }, 400);
      }

      function resetAll() {
        triggered = {};
        vignette.classList.remove("active");
        gradient.classList.remove("active");
        [scene1].forEach(s => {
          s.style.opacity = "0";
          s.classList.remove("active", "exit");
        });
      }

      function restartVideo() {
        resetAll();
        video.currentTime = 0;
        video.play();
      }

      function skipToText() {
        resetAll();
        video.currentTime = T.effectsIn - 0.5;
        video.play();
      }

      video.addEventListener("timeupdate", () => {
        const t = video.currentTime;
        timeDisplay.textContent = t.toFixed(2);

        if (t >= T.effectsIn && !triggered.effectsIn) {
          triggered.effectsIn = true;
          vignette.classList.add("active");
          gradient.classList.add("active");
        }

        if (t >= T.scene1In && !triggered.s1in) {
          triggered.s1in = true;
          showScene(scene1);
        }
        if (t >= T.scene1Out && !triggered.s1out) {
          triggered.s1out = true;
          exitScene(scene1);
        }

        // Add more scene triggers...
      });

      video.addEventListener("loadeddata", () => video.play());

      // Scale to fit viewport
      function scaleToFit() {
        const stage = document.querySelector('.stage');
        const scale = Math.min((window.innerWidth - 40) / 1080, (window.innerHeight - 40) / 1920, 1);
        stage.style.transform = `scale(${scale})`;
      }
      scaleToFit();
      window.addEventListener('resize', scaleToFit);
    </script>
  </body>
</html>
