<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad 3 - Room? BidMyRoom - Preview</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap");

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 { font-size: 18px; margin-bottom: 20px; color: #888; }

    .preview-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    /* Preview at 40% scale of 1080x1920 */
    .video-frame {
      position: relative;
      width: 432px;
      height: 768px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cream gradient background (shown after video) */
    .gradient-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #f7f1e6 0%, #ecdfc7 100%);
      opacity: 0;
    }

    /* Overlay for text elements */
    .overlay {
      position: absolute;
      inset: 0;
      --scale: 0.4;
    }

    /* Room? text */
    .room-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .room-q {
      font-family: "Poppins", sans-serif;
      font-size: calc(160px * var(--scale));
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f81c0;
      display: inline-flex;
      align-items: baseline;
    }

    .room-q .rl {
      display: inline-block;
      opacity: 0;
      transform: translateY(-110%) scale(1.1);
    }

    .room-q .qmark {
      display: inline-block;
      opacity: 0;
      transform: scale(0.3) rotate(-20deg);
      margin-left: 0.05em;
    }

    /* Logo scene */
    .logo-scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: calc(30px * var(--scale));
    }

    .logo-icon {
      width: calc(150px * var(--scale));
      height: calc(150px * var(--scale));
      opacity: 0;
      transform: translateX(-80px) rotate(-25deg) scale(0.6);
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      border-radius: 22%;
    }

    .wordmark {
      font-family: "Poppins", sans-serif;
      font-size: calc(110px * var(--scale));
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f81c0;
      display: flex;
    }

    .wordmark .letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%);
    }

    .tag-small {
      font-family: "Poppins", sans-serif;
      font-size: calc(28px * var(--scale));
      font-weight: 500;
      letter-spacing: 0.1em;
      color: rgba(15, 129, 192, 0.65);
      opacity: 0;
      transform: translateY(16px);
      margin-top: calc(-4px * var(--scale));
      /* Align with wordmark: icon width (150px) + gap (30px) = 180px */
      padding-left: calc(180px * var(--scale));
    }

    /* Controls */
    .controls {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      width: 280px;
    }

    .time-display {
      font-size: 36px;
      font-weight: 700;
      font-family: 'SF Mono', monospace;
      text-align: center;
      margin-bottom: 10px;
      color: #0f81c0;
    }

    .phase-display {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
      padding: 8px;
      background: #333;
      border-radius: 4px;
    }

    .phase-display strong { color: #0f81c0; }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 15px;
    }

    button {
      background: #0f81c0;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    button:hover { background: #0a6da8; }
    button.secondary { background: #444; }
    button.secondary:hover { background: #555; }

    .jump-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .jump-buttons button {
      background: #333;
      padding: 12px 8px;
      font-size: 12px;
    }

    .jump-buttons button:hover { background: #444; }
    .jump-buttons button.active { background: #0f81c0; }

    .scrub { margin-top: 15px; }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: #444;
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #0f81c0;
      border-radius: 50%;
      cursor: pointer;
    }

    .timeline-info {
      margin-top: 20px;
      font-size: 11px;
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Ad 3 — Room? BidMyRoom — Preview</h1>

  <div class="preview-container">
    <div class="video-frame">
      <video id="video" playsinline>
        <source src="../un-edited-videos/video-3.MOV" type="video/mp4">
      </video>

      <div class="gradient-bg" id="gradientBg"></div>

      <div class="overlay">
        <div class="room-text" id="roomText">
          <h1 class="room-q">
            <span class="rl" id="r1">R</span>
            <span class="rl" id="r2">o</span>
            <span class="rl" id="r3">o</span>
            <span class="rl" id="r4">m</span>
            <span class="qmark" id="qmark">?</span>
          </h1>
        </div>

        <div class="logo-scene" id="logoScene">
          <div class="logo-container">
            <div class="lockup">
              <div class="logo-icon" id="logoIcon">
                <img src="../assets/logo-icon.svg" alt="BidMyRoom">
              </div>
              <div class="wordmark" id="wordmark">
                <span class="letter">B</span>
                <span class="letter">i</span>
                <span class="letter">d</span>
                <span class="letter">M</span>
                <span class="letter">y</span>
                <span class="letter">R</span>
                <span class="letter">o</span>
                <span class="letter">o</span>
                <span class="letter">m</span>
              </div>
            </div>
            <p class="tag-small" id="tagSmall">Let hotels come to you</p>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="time-display"><span id="time">0.00</span>s</div>
      <div class="phase-display">Phase: <strong id="phase">Video</strong></div>

      <div class="buttons">
        <button onclick="skip(-1)" class="secondary">-1s</button>
        <button onclick="skip(-0.1)" class="secondary">-0.1s</button>
        <button onclick="togglePlay()" id="playBtn">Play</button>
        <button onclick="skip(0.1)" class="secondary">+0.1s</button>
        <button onclick="skip(1)" class="secondary">+1s</button>
      </div>

      <div class="buttons">
        <button onclick="restart()">Restart</button>
      </div>

      <div class="jump-buttons">
        <button onclick="jumpTo(0)">Video<br><small>0s</small></button>
        <button onclick="jumpTo(14.8)">Room?<br><small>14.8s</small></button>
        <button onclick="jumpTo(16.3)">Logo<br><small>16.3s</small></button>
        <button onclick="jumpTo(18)">End<br><small>18s</small></button>
      </div>

      <div class="scrub">
        <input type="range" id="scrubber" min="0" max="19" step="0.01" value="0">
      </div>

      <div class="timeline-info">
        <strong>0 - 14.8s:</strong> Video plays<br>
        <strong>14.8 - 16.3s:</strong> Cream bg + "Room?"<br>
        <strong>16.3 - 19s:</strong> BidMyRoom logo
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const gradientBg = document.getElementById('gradientBg');
    const timeDisplay = document.getElementById('time');
    const phaseDisplay = document.getElementById('phase');
    const playBtn = document.getElementById('playBtn');
    const scrubber = document.getElementById('scrubber');

    const roomText = document.getElementById('roomText');
    const r1 = document.getElementById('r1');
    const r2 = document.getElementById('r2');
    const r3 = document.getElementById('r3');
    const r4 = document.getElementById('r4');
    const qmark = document.getElementById('qmark');

    const logoScene = document.getElementById('logoScene');
    const logoIcon = document.getElementById('logoIcon');
    const wordmark = document.getElementById('wordmark');
    const tagSmall = document.getElementById('tagSmall');
    const letters = wordmark.querySelectorAll('.letter');

    const VIDEO_END = 14.8;
    const LOGO_START = 16.3;
    const TOTAL = 19;

    let adTime = 0;
    let playing = false;
    let rafId = null;
    let lastTick = 0;

    function easeBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function togglePlay() {
      playing ? stop() : play();
    }

    function play() {
      playing = true;
      playBtn.textContent = 'Pause';
      lastTick = performance.now();
      if (adTime < VIDEO_END) {
        video.currentTime = adTime;
        video.play();
      }
      loop();
    }

    function stop() {
      playing = false;
      playBtn.textContent = 'Play';
      video.pause();
      if (rafId) cancelAnimationFrame(rafId);
    }

    function loop() {
      if (!playing) return;

      const now = performance.now();
      const delta = (now - lastTick) / 1000;
      lastTick = now;

      if (adTime < VIDEO_END) {
        adTime = video.currentTime;
        if (adTime >= VIDEO_END) {
          adTime = VIDEO_END;
          video.pause();
        }
      } else {
        adTime += delta;
        if (adTime >= TOTAL) {
          adTime = TOTAL;
          stop();
        }
      }

      render();
      rafId = requestAnimationFrame(loop);
    }

    function skip(dt) {
      adTime = Math.max(0, Math.min(TOTAL, adTime + dt));
      syncVideo();
      render();
    }

    function jumpTo(t) {
      stop();
      adTime = t;
      syncVideo();
      render();
    }

    function restart() {
      adTime = 0;
      syncVideo();
      render();
      play();
    }

    function syncVideo() {
      if (adTime < VIDEO_END) {
        video.currentTime = adTime;
      } else {
        video.currentTime = VIDEO_END - 0.01;
      }
    }

    function render() {
      timeDisplay.textContent = adTime.toFixed(2);
      scrubber.value = adTime;

      // Phase
      let phase = 'Video';
      if (adTime >= LOGO_START) phase = 'Logo';
      else if (adTime >= VIDEO_END) phase = 'Room?';
      phaseDisplay.textContent = phase;

      // ========== PHASE: VIDEO ==========
      if (adTime < VIDEO_END) {
        gradientBg.style.opacity = 0;
        roomText.style.opacity = 0;
        logoScene.style.opacity = 0;
        return;
      }

      // Show gradient background after video
      gradientBg.style.opacity = 1;

      // ========== PHASE: ROOM? ==========
      if (adTime >= VIDEO_END && adTime < LOGO_START) {
        roomText.style.opacity = 1;
        logoScene.style.opacity = 0;

        const rt = adTime - VIDEO_END;

        // Letter drops (R-o-o-m)
        const letterEls = [r1, r2, r3, r4];
        letterEls.forEach((el, i) => {
          const delay = 0.05 + i * 0.1;
          const duration = 0.6;
          if (rt >= delay) {
            const progress = Math.min(1, (rt - delay) / duration);
            const p = easeBack(progress);
            el.style.opacity = p;
            el.style.transform = `translateY(${-110 * (1 - p)}%) scale(${1.1 - 0.1 * p})`;
          } else {
            el.style.opacity = 0;
            el.style.transform = 'translateY(-110%) scale(1.1)';
          }
        });

        // ? punch
        const qDelay = 0.4;
        const qDuration = 0.5;
        if (rt >= qDelay) {
          const progress = Math.min(1, (rt - qDelay) / qDuration);
          const p = easeBack(progress);
          qmark.style.opacity = p;
          qmark.style.transform = `scale(${0.3 + 0.7 * p}) rotate(${-20 * (1 - p)}deg)`;
        } else {
          qmark.style.opacity = 0;
          qmark.style.transform = 'scale(0.3) rotate(-20deg)';
        }

        // Fade out near end (last 0.2s before logo)
        if (rt > 1.3) {
          const fadeProgress = (rt - 1.3) / 0.2;
          roomText.style.opacity = 1 - fadeProgress;
        }

        return;
      }

      // ========== PHASE: LOGO ==========
      if (adTime >= LOGO_START) {
        roomText.style.opacity = 0;
        logoScene.style.opacity = 1;

        const lt = adTime - LOGO_START;

        // Icon swoop
        if (lt < 0.75) {
          const p = easeOut(lt / 0.75);
          logoIcon.style.opacity = p;
          const rotate = lt < 0.5 ? -25 + 29 * (lt / 0.5) : 4 - 4 * ((lt - 0.5) / 0.25);
          const scale = lt < 0.5 ? 0.6 + 0.48 * (lt / 0.5) : 1.08 - 0.08 * ((lt - 0.5) / 0.25);
          logoIcon.style.transform = `translateX(${-80 * (1 - p)}px) rotate(${rotate}deg) scale(${scale})`;
        } else {
          logoIcon.style.opacity = 1;
          logoIcon.style.transform = 'translateX(0) rotate(0) scale(1)';
        }

        // Letters
        letters.forEach((letter, i) => {
          const delay = 0.4 + i * 0.05;
          const duration = 0.35;
          if (lt >= delay) {
            const progress = Math.min(1, (lt - delay) / duration);
            const p = easeOut(progress);
            letter.style.opacity = p;
            letter.style.transform = `translateY(${100 * (1 - p)}%)`;
          } else {
            letter.style.opacity = 0;
            letter.style.transform = 'translateY(100%)';
          }
        });

        // Tagline
        const tagDelay = 1.0;
        const tagDuration = 0.5;
        if (lt >= tagDelay) {
          const progress = Math.min(1, (lt - tagDelay) / tagDuration);
          const p = easeOut(progress);
          tagSmall.style.opacity = p;
          tagSmall.style.transform = `translateY(${16 * (1 - p)}px)`;
        } else {
          tagSmall.style.opacity = 0;
          tagSmall.style.transform = 'translateY(16px)';
        }
      }
    }

    // Scrubber
    scrubber.addEventListener('input', e => jumpTo(parseFloat(e.target.value)));

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowLeft') skip(-1);
      if (e.code === 'ArrowRight') skip(1);
    });

    // Init
    render();
  </script>
</body>
</html>
