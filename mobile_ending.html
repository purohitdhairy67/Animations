<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BidMyRoom — Mobile Ending</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap");

      :root {
        --brand: #0f81c0;
        --brand-deep: #0a5a87;
        --cream-top: #f7f1e6;
        --cream-bottom: #ecdfc7;
        --ink: #0f81c0;
        --ease: cubic-bezier(0.86, 0, 0.07, 1);
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: var(--cream-top);
        color: var(--ink);
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--cream-top) 0%,
          var(--cream-bottom) 100%
        );
      }

      /* Intro dissolve from the previous video — soft cream wash instead of black */
      .intro-fade {
        position: absolute;
        inset: 0;
        background: var(--cream-top);
        opacity: 1;
        animation: intro-out 1s var(--ease-out) forwards;
      }

      @keyframes intro-out {
        to {
          opacity: 0;
        }
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 8vw;
        opacity: 0;
        pointer-events: none;
        transform: scale(1.02);
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }

      .scene.active {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      .scene.fade-out {
        opacity: 0;
        transform: scale(0.985);
      }

      /* -------- Scene 1: tagline -------- */
      .tagline {
        font-size: 6.8vw;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
        letter-spacing: -0.01em;
        max-width: 85vw;
        color: var(--ink);
      }

      .tagline .word {
        display: inline-block;
        opacity: 0;
        filter: blur(10px);
      }

      #scene-1.active .tagline .word {
        animation: word-in 0.55s var(--ease-out) forwards;
      }

      #scene-1.active .tagline .word:nth-of-type(1) { animation-delay: 0.08s; }
      #scene-1.active .tagline .word:nth-of-type(2) { animation-delay: 0.16s; }
      #scene-1.active .tagline .word:nth-of-type(3) { animation-delay: 0.24s; }
      #scene-1.active .tagline .word:nth-of-type(4) { animation-delay: 0.32s; }
      #scene-1.active .tagline .word:nth-of-type(5) { animation-delay: 0.40s; }
      #scene-1.active .tagline .word:nth-of-type(6) { animation-delay: 0.48s; }

      @keyframes word-in {
        to {
          opacity: 1;
          filter: blur(0);
        }
      }

      /* -------- Scene 2: Room? -------- */
      .room-q {
        font-size: 14vw;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--ink);
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }

      #scene-2.active .room-q {
        animation: room-in 0.6s var(--ease-back) forwards;
      }

      @keyframes room-in {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* -------- Scene 3: logo lockup -------- */
      #scene-3 {
        gap: 4vh;
      }

      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3vw;
      }

      .logo-icon {
        width: 14vw;
        height: 14vw;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translateX(-50vw) rotate(-25deg) scale(0.6);
        filter: drop-shadow(0 10px 24px rgba(15, 129, 192, 0.25));
      }

      .logo-icon img {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 22%;
      }

      #scene-3.active .logo-icon {
        animation: icon-swoop 0.75s var(--ease-out) forwards;
      }

      @keyframes icon-swoop {
        65% {
          opacity: 1;
          transform: translateX(0) rotate(4deg) scale(1.08);
        }
        100% {
          opacity: 1;
          transform: translateX(0) rotate(0) scale(1);
        }
      }

      .wordmark {
        font-size: 10vw;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
        display: flex;
        overflow: hidden;
      }

      .wordmark .letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(100%);
      }

      #scene-3.active .wordmark .letter {
        animation: letter-in 0.4s var(--ease-out) forwards;
      }

      #scene-3.active .wordmark .letter:nth-child(1) { animation-delay: 0.55s; }
      #scene-3.active .wordmark .letter:nth-child(2) { animation-delay: 0.60s; }
      #scene-3.active .wordmark .letter:nth-child(3) { animation-delay: 0.65s; }
      #scene-3.active .wordmark .letter:nth-child(4) { animation-delay: 0.70s; }
      #scene-3.active .wordmark .letter:nth-child(5) { animation-delay: 0.75s; }
      #scene-3.active .wordmark .letter:nth-child(6) { animation-delay: 0.80s; }
      #scene-3.active .wordmark .letter:nth-child(7) { animation-delay: 0.85s; }
      #scene-3.active .wordmark .letter:nth-child(8) { animation-delay: 0.90s; }
      #scene-3.active .wordmark .letter:nth-child(9) { animation-delay: 0.95s; }

      @keyframes letter-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .tag-small {
        font-size: 3vw;
        font-weight: 500;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(15, 129, 192, 0.65);
        opacity: 0;
        transform: translateY(16px);
      }

      #scene-3.active .tag-small {
        animation: tag-in 0.55s var(--ease-out) 1.25s forwards;
      }

      @keyframes tag-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="intro-fade"></div>

      <!-- Scene 1: Tagline -->
      <div class="scene" id="scene-1">
        <h1 class="tagline">
          <span class="word">The</span>&nbsp;<span class="word">right</span>&nbsp;<span class="word">space</span><br />
          <span class="word">is</span>&nbsp;<span class="word">out</span>&nbsp;<span class="word">there.</span>
        </h1>
      </div>

      <!-- Scene 2: Room? -->
      <div class="scene" id="scene-2">
        <h1 class="room-q">Room?</h1>
      </div>

      <!-- Scene 3: Logo lockup -->
      <div class="scene" id="scene-3">
        <div class="lockup">
          <div class="logo-icon">
            <img src="Assets/logo-icon.svg" alt="BidMyRoom" />
          </div>
          <div class="wordmark">
            <span class="letter">B</span>
            <span class="letter">i</span>
            <span class="letter">d</span>
            <span class="letter">M</span>
            <span class="letter">y</span>
            <span class="letter">R</span>
            <span class="letter">o</span>
            <span class="letter">o</span>
            <span class="letter">m</span>
          </div>
        </div>
        <div class="tag-small">Your space. Your bid.</div>
      </div>
    </div>

    <script>
      // Long lead-in so the clip opens on a held background before any motion.
      const START_DELAY = 25000;

      const s1 = document.getElementById("scene-1");
      const s2 = document.getElementById("scene-2");
      const s3 = document.getElementById("scene-3");

      window.addEventListener("load", () => {
        // Scenes crossfade: outgoing fades out while the next fades in (~300ms overlap).
        // --- Scene 1: tagline
        setTimeout(() => s1.classList.add("active"), START_DELAY + 150);
        setTimeout(() => s1.classList.add("fade-out"), START_DELAY + 2300);

        // --- Scene 2: Room?
        setTimeout(() => s2.classList.add("active"), START_DELAY + 2600);
        setTimeout(() => s2.classList.add("fade-out"), START_DELAY + 3900);

        // --- Scene 3: logo lockup
        setTimeout(() => s3.classList.add("active"), START_DELAY + 4200);
      });
    </script>
  </body>
</html>
